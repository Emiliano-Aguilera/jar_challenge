# Batch runs on the team's simulation server (the self-hosted runners labelled "jarsim").
# Start it from the Actions tab or:  gh workflow run simular.yml -f rama=<branch> -f mapas=maze_1_6x5
# It always runs from development (the server refuses other refs) and tests the branch in `rama`.
# Don't edit this file: the server refuses any version but its reviewed copy (ask the owner).
# Each run (map × repetition) is its own job, at most 2 of a request at once; the server has 4
# run runners, so requests from different people share them through GitHub's queue.
# Inputs reach scripts only through env vars; the server (/srv/jarsim/bin/correr-lote on that
# PC) validates them again. Team-only file: excluded from the final submission (docs/team/FLOW.md).
name: simular
run-name: "simular ${{ inputs.rama }} · ${{ inputs.mapas }} ×${{ inputs.repeticiones }} · ${{ inputs.duracion }} s${{ inputs.grabar && ' · rec' || '' }}${{ inputs.largada != '0,0,0' && format(' · largada {0}', inputs.largada) || '' }}"

on:
  workflow_dispatch:
    inputs:
      rama:
        description: Branch of this repo to test
        type: string
        default: development
      mapas:
        description: Maps, comma-separated (maze_1_6x5, maze_2_6x5, maze_3_6x6, maze_4_metal_6x6, laberinto_1, laberinto_simple)
        type: string
        default: maze_1_6x5
      repeticiones:
        description: Runs per map (1-10; at most 12 runs in total)
        type: string
        default: "1"
      duracion:
        description: Seconds per run after the judge publishes /map (10-600)
        type: string
        default: "120"
      grabar:
        description: Record an MCAP per run for the viewer (deleted after 7 days; results are kept)
        type: boolean
        default: false
      largada:
        description: "Robot start, as if placed by hand: x,y in m and yaw in rad, at most 0.25 m from the origin (e.g. 0.15,-0.1,0.2)"
        type: string
        default: "0,0,0"

permissions: {}

jobs:
  # Splits the request into runs. On a GitHub-hosted runner: it only checks and splits strings
  # (no secrets, no checkout), so it doesn't take one of the server's runners.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      corridas: ${{ steps.plan.outputs.corridas }}
    steps:
      - name: Check the request and list its runs
        id: plan
        env:
          MAPAS: ${{ inputs.mapas }}
          REPETICIONES: ${{ inputs.repeticiones }}
          DURACION: ${{ inputs.duracion }}
          LARGADA: ${{ inputs.largada }}
        run: |
          mal() { echo "::error::$*"; exit 1; }
          d='-?[0-9](\.[0-9]{1,3})?'
          [[ "$LARGADA" =~ ^$d,$d,$d$ ]] || mal "largada: x,y,yaw as decimals with up to 3 places, e.g. 0.15,-0.1,0.2"
          IFS=, read -r x y t <<< "$LARGADA"
          awk -v x="$x" -v y="$y" -v t="$t" 'BEGIN { exit !(x * x + y * y <= 0.0625 && t >= -3.142 && t <= 3.142) }' ||
            mal "largada: at most 0.25 m from the origin, and yaw from -3.142 to 3.142 rad"
          [[ "$MAPAS" =~ ^[a-z0-9_]{1,40}(,[a-z0-9_]{1,40}){0,9}$ ]] || mal "mapas: comma-separated map names"
          [[ "$REPETICIONES" =~ ^([1-9]|10)$ ]] || mal "repeticiones: 1 to 10"
          [[ "$DURACION" =~ ^[1-9][0-9]{1,2}$ ]] && [ "$DURACION" -ge 10 ] && [ "$DURACION" -le 600 ] ||
            mal "duracion: 10 to 600 seconds"
          IFS=, read -r -a m <<< "$MAPAS"
          [ "$(printf '%s\n' "${m[@]}" | sort -u | wc -l)" -eq "${#m[@]}" ] || mal "a map is repeated in mapas"
          n=$(( ${#m[@]} * REPETICIONES ))
          [ "$n" -le 12 ] || mal "$n runs requested, at most 12 per request"
          for x in "${m[@]}"; do for (( r = 1; r <= REPETICIONES; r++ )); do
            jq -nc --arg mapa "$x" --argjson rep "$r" '{mapa: $mapa, rep: $rep}'
          done; done | jq -sc . | sed 's/^/corridas=/' >> "$GITHUB_OUTPUT"
          echo "$n runs: $MAPAS × $REPETICIONES"

  corrida:
    needs: plan
    name: ${{ matrix.mapa }} · ${{ matrix.rep }}
    runs-on: jarsim
    # One run: at most 600 + 300 s, plus the build.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2   # per request: one request never takes every run runner
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.corridas) }}
    steps:
      - name: Run
        env:
          RAMA: ${{ inputs.rama }}
          MAPA: ${{ matrix.mapa }}
          DURACION: ${{ inputs.duracion }}
          GRABAR: ${{ inputs.grabar }}
          LARGADA: ${{ inputs.largada }}
          JARSIM_ID_FILE: ${{ runner.temp }}/lote-id
        # exec: cancelling the job signals correr-lote itself, which removes its containers.
        # JARSIM_GPU comes from the runner (each one has its GPU).
        run: >-
          exec /srv/jarsim/bin/correr-lote --rama "$RAMA" --mapas "$MAPA"
          --repeticiones 1 --duracion "$DURACION" --grabar "$GRABAR" --largada "$LARGADA"

      - name: Summary
        id: resumen
        if: always()
        env:
          JARSIM_ID_FILE: ${{ runner.temp }}/lote-id
          MAPA: ${{ matrix.mapa }}
          REP: ${{ matrix.rep }}
        run: |
          [ -f "$JARSIM_ID_FILE" ] || { echo "No run was started (see the step above)."; exit 0; }
          id="$(cat "$JARSIM_ID_FILE")"
          [[ "$id" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}(-[2-9])?$ ]] || { echo "bad batch id"; exit 1; }
          lote="/srv/jarsim-data/runs/$id"
          echo "lote=$id" >> "$GITHUB_OUTPUT"
          echo "### $MAPA · repetition $REP" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$lote/resumen.md" ]; then cat "$lote/resumen.md" >> "$GITHUB_STEP_SUMMARY"
          else echo "Run \`$id\` ended without a summary (see the step above)." >> "$GITHUB_STEP_SUMMARY"; fi
          # Small artifact: summaries, results and plots, never the recordings (on the viewer).
          # Run folders are written by the tested code: copy regular files only, no symlinks.
          art="$RUNNER_TEMP/artefacto"; rm -rf "$art"; mkdir -p "$art"
          copiar() { [ -f "$1" ] && [ ! -L "$1" ] && mkdir -p "$2" && cp "$1" "$2/" || true; }
          for f in lote.json resumen.json resumen.md; do copiar "$lote/$f" "$art"; done
          for d in "$lote"/corridas/*/; do
            [ -d "$d" ] || continue
            n="$(basename "$d")"
            for f in meta.json resultado.json resumen.md grafico.png; do copiar "$d$f" "$art/corridas/$n"; done
          done

      - name: Upload the summary
        if: always() && steps.resumen.outputs.lote != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lote-${{ steps.resumen.outputs.lote }}
          path: ${{ runner.temp }}/artefacto/
          if-no-files-found: ignore
          retention-days: 30
